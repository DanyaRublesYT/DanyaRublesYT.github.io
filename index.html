<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusorDrop</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            cursor: pointer;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <video id="player" muted playsinline>
        <source src="musordrop.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById('player');
        
        // Создаём аудио-элемент для зацикленного звука
        const audio = new Audio();
        audio.src = 'https://www.myinstants.com/media/sounds/musor-drop.mp3';
        audio.loop = true;
        audio.volume = 1;

        // Функция запуска всего
        function startEverything() {
            // Видео без звука (muted уже стоит)
            video.play().catch(() => {});
            
            // Зацикленный звук
            audio.play().catch(() => {});
        }

        // Пытаемся запустить сразу
        startEverything();

        // Если браузер блокирует - запускаем по клику
        document.addEventListener('click', () => {
            startEverything();
        });

        // Клик по видео не должен ставить на паузу
        video.addEventListener('click', (e) => e.stopPropagation());
    </script>
</body>
</html>
