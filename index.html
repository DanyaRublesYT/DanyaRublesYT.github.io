<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusorDrop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* Видео на весь экран */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* Кнопка myinstants ПОВЕРХ видео - ОГРОМНАЯ */
        .myinstants-btn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: min(80vw, 500px);
            height: min(80vw, 500px);
            border: none;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.3);
            transition: transform 0.2s;
        }
        
        .myinstants-btn:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }
        
        .myinstants-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }
        
        .myinstants-btn iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none; /* Чтобы клик шёл на кнопку, а не на iframe */
        }
        
        /* Подпись для атмосферы */
        .sub {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            color: rgba(255,255,255,0.2);
            font-size: 14px;
            font-family: Arial, sans-serif;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <!-- Видео (без звука) -->
    <video id="player" muted playsinline>
        <source src="musordrop.mp4" type="video/mp4">
    </video>

    <!-- САМА КНОПКА С MYINSTANTS (огромная, поверх видео) -->
    <button class="myinstants-btn" id="myBtn">
        <iframe 
            src="https://www.myinstants.com/instant/musor-drop-82861/embed/" 
            allow="autoplay">
        </iframe>
    </button>

    <div class="sub">нажми на мусорку</div>

    <script>
        const video = document.getElementById('player');
        const btn = document.getElementById('myBtn');

        // Автозапуск видео (без звука)
        video.play().catch(() => {});

        // При клике на кнопку myinstants - перезапускаем видео
        btn.addEventListener('click', () => {
            video.play().catch(() => {});
        });

        // Клик по видео не должен мешать
        video.addEventListener('click', (e) => e.stopPropagation());
    </script>
</body>
</html>
