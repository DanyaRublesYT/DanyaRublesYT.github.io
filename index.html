<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusorDrop</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            cursor: pointer;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        /* Кнопка myinstants поверх видео */
        .sound-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            width: 120px;
            height: 120px;
            border: none;
            background: transparent;
            cursor: pointer;
        }
        .sound-button iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none; /* Чтобы клик шёл на кнопку */
        }
        /* Оверлей для клика по всей странице */
        .click-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Оверлей для клика -->
    <div class="click-overlay" id="overlay"></div>

    <!-- Видео -->
    <video id="player" muted playsinline>
        <source src="musordrop.mp4" type="video/mp4">
    </video>

    <!-- Кнопка myinstants -->
    <div class="sound-button">
        <iframe 
            src="https://www.myinstants.com/instant/musor-drop-82861/embed/" 
            allow="autoplay">
        </iframe>
    </div>

    <script>
        const video = document.getElementById('player');
        const overlay = document.getElementById('overlay');

        // Функция запуска видео
        function playVideo() {
            video.play().catch(() => {});
        }

        // Автозапуск видео
        playVideo();

        // По клику на оверлей — запускаем видео (звук уже играет с кнопки)
        overlay.addEventListener('click', () => {
            playVideo();
        });

        // Чтобы клик по видео не ставил на паузу
        video.addEventListener('click', (e) => e.stopPropagation());
    </script>
</body>
</html>
