<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusorDrop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            position: relative;
        }
        
        /* Видео на весь экран */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* Огромная кнопка ПОВЕРХ видео */
        .btn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            
            /* Огромный размер */
            width: 80vw;
            max-width: 600px;
            height: 80vw;
            max-height: 600px;
            
            /* Стили */
            border-radius: 50%;
            border: 8px solid #fff;
            background: rgba(255, 0, 0, 0.85);
            color: #fff;
            font-size: clamp(28px, 6vw, 64px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 0 80px rgba(255, 0, 0, 0.8), inset 0 0 80px rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
            text-shadow: 2px 2px 20px rgba(0, 0, 0, 0.5);
            padding: 20px;
            line-height: 1.2;
            word-break: break-word;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn:hover {
            transform: translate(-50%, -50%) scale(1.07);
            box-shadow: 0 0 120px rgba(255, 0, 0, 1), inset 0 0 100px rgba(255, 255, 255, 0.2);
        }
        
        .btn:active {
            transform: translate(-50%, -50%) scale(0.93);
        }
        
        .btn.playing {
            background: rgba(0, 200, 0, 0.9);
            box-shadow: 0 0 80px rgba(0, 200, 0, 0.8), inset 0 0 80px rgba(255, 255, 255, 0.1);
        }
        
        .btn.playing:hover {
            box-shadow: 0 0 120px rgba(0, 200, 0, 1), inset 0 0 100px rgba(255, 255, 255, 0.2);
        }
        
        /* Подпись мелкая внизу (для атмосферы) */
        .sub {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <!-- Видео (без звука) -->
    <video id="player" muted playsinline>
        <source src="musordrop.mp4" type="video/mp4">
    </video>

    <!-- Огромная кнопка поверх видео -->
    <button class="btn" id="playBtn">🎵<br>ДРОП</button>

    <div class="sub">нажми на круг</div>

    <script>
        const video = document.getElementById('player');
        const btn = document.getElementById('playBtn');

        // Звук из локального MP3
        const audio = new Audio('musor-drop.mp3');
        audio.loop = true;
        audio.volume = 1;

        let isPlaying = false;

        btn.addEventListener('click', () => {
            if (!isPlaying) {
                // Включаем
                video.play().catch(() => {});
                audio.play().catch(() => {});
                btn.textContent = '🔇\nВЫКЛ';
                btn.classList.add('playing');
                isPlaying = true;
            } else {
                // Выключаем
                video.pause();
                audio.pause();
                video.currentTime = 0;
                audio.currentTime = 0;
                btn.textContent = '🎵\nДРОП';
                btn.classList.remove('playing');
                isPlaying = false;
            }
        });

        // Клик по видео не должен мешать
        video.addEventListener('click', (e) => e.stopPropagation());
    </script>
</body>
</html>
