<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusorDrop</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            cursor: pointer;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <video id="player" playsinline>
        <source src="musordrop.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById('player');

        // Убираем всё, что глушит звук
        video.muted = false;
        video.volume = 1;

        // Автовоспроизведение (может не сработать из-за политики браузера)
        video.play().catch(() => {
            // Если заблокировано — ждём клика
            document.addEventListener('click', () => {
                video.play().catch(() => {});
            }, { once: true });
        });

        // Клик в любом месте — перезапуск со звуком
        document.addEventListener('click', () => {
            video.play().catch(() => {});
        });

        // Чтобы клик по видео не ставил на паузу
        video.addEventListener('click', (e) => e.stopPropagation());
    </script>
</body>
</html>
